[project]
name = "rag-publications"
version = "0.1.0"
description = "Chat with Dr Reju Sam John's peer-reviewed publications using RAG"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Dr Reju Sam John", email = "rejusamjohn@gmail.com"}]
dependencies = [
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "langchain-core>=0.3.0",
    "chromadb>=0.5.0",
    "pypdf>=4.0.0",
    "streamlit>=1.38.0",
]

[project.optional-dependencies]
local = ["ollama>=0.3.0"]
huggingface = ["langchain-huggingface>=0.1.0", "huggingface-hub>=0.25.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"eval/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: calls the real Groq API; run manually with `pytest -m live`",
]
